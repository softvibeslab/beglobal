<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Be Global · Mapa neural de la ruta 0 → 100</title>
<link rel="icon" href="../agent/icons/icon.svg" />
<style>
:root{--navy:#062F55;--navy2:#0B4A82;--blue:#63ABE6;--sky:#B4E5FC;--gold:#FDB12B;--green:#45B114;--red:#E5484D;--bg:#F7FAFE;--line:#E2EDF8;--muted:#5F6F83;--canvas:#041A30;--canvas2:#083055}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Montserrat,Nunito,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:var(--navy);overflow:hidden}
button{font:inherit;cursor:pointer}
.topbar{position:fixed;inset:0 0 auto 0;height:66px;z-index:50;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(6,47,85,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.02em;text-decoration:none;color:var(--navy)}.brand img{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:14px;padding:9px 13px;font-weight:850;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn:hover{background:#EAF5FF}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.primary:hover{background:var(--navy2)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#3B2500}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff;color:var(--red);border-color:#f5c2c4}.btn.small{padding:6px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}.seg button{border:0;background:#fff;color:var(--muted);padding:9px 12px;font-weight:850;font-size:13px}.seg button.on{background:var(--navy);color:#fff}
#stage{position:fixed;inset:66px 0 0 0;background:radial-gradient(1200px 700px at 30% 20%,var(--canvas2),var(--canvas) 70%);cursor:grab}#stage.dragging{cursor:grabbing}
svg#map{width:100%;height:100%;display:block;touch-action:none}
.bgdot{fill:#63ABE6;opacity:.12;animation:breath 6s ease-in-out infinite}.bgline{stroke:#63ABE6;stroke-opacity:.08;stroke-width:1}
@keyframes breath{0%,100%{opacity:.08}50%{opacity:.22}}
.edge{fill:none;stroke:#3F7FB8;stroke-width:2.2;stroke-opacity:.55;transition:stroke .3s,stroke-opacity .3s}
.edge.locked{stroke:#3a5470;stroke-dasharray:6 8;stroke-opacity:.45}
.edge.done{stroke:var(--green);stroke-opacity:.85}
.edge.active{stroke:var(--gold);stroke-opacity:.95;stroke-width:3}
.edge.pulse{stroke-dasharray:10 14;animation:flow 1.4s linear infinite}
.edge.gate{stroke:var(--gold)}.edge.gate.locked{stroke:#8a6a2a}
@keyframes flow{to{stroke-dashoffset:-48}}
.node{cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.node.new{transform:scale(0)}
.node .core{transition:r .25s,fill .3s,stroke .3s}
.node .halo{fill:none;stroke-width:2;opacity:.55;animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.18);opacity:.65}}
.node text{font-family:inherit;fill:#fff;pointer-events:none;user-select:none}
.node .lbl{font-weight:900;font-size:15px}.node .sub{font-size:11px;fill:var(--sky);font-weight:700}.node .badge{font-size:10px;font-weight:900;fill:#fff}
.node.point .core{fill:#fff;stroke:var(--gold);stroke-width:5}.node.point .lbl{fill:var(--navy)}
.node.stage .core{fill:var(--navy2);stroke:var(--blue);stroke-width:3}
.node.stage.available .core{stroke:var(--gold);stroke-width:4}
.node.stage.complete .core{fill:#1f6d12;stroke:var(--green)}
.node.stage.locked .core{fill:#0e2a45;stroke:#3a5470;stroke-dasharray:5 5}.node.stage.locked .lbl{fill:#8fa6bb}
.node.stage.expanded .core{stroke-width:5}
.node.gate .core{fill:#2b2306;stroke:var(--gold);stroke-width:3}.node.gate.open .core{fill:var(--gold)}.node.gate.open .lbl{fill:#3B2500}.node.gate.locked .core{stroke-dasharray:5 5;stroke:#8a6a2a}
.node.ms .core{fill:#0e2a45;stroke:var(--blue);stroke-width:2.5}
.node.ms.locked .core{stroke:#3a5470;stroke-dasharray:4 4;fill:#0b2138}.node.ms.locked text{fill:#8fa6bb}
.node.ms.submitted .core{fill:#6a4a08;stroke:var(--gold)}
.node.ms.approved .core{fill:var(--green);stroke:#9BE87A}
.node.ms.activeMission .core{stroke:var(--gold);stroke-width:4}
.node.cluster .core{fill:#12395e;stroke:var(--sky);stroke-width:2}
.node.step .core{fill:#0e2a45;stroke:var(--sky);stroke-width:1.6}.node.step.done .core{fill:#1f6d12;stroke:var(--green)}
.node.selected .core{stroke:#fff!important;stroke-width:5!important}
.ring{fill:none;stroke:rgba(255,255,255,.18);stroke-width:5}.ringfg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray .6s}
.node.stage.complete .ringfg{stroke:#9BE87A}
.hud{position:fixed;left:14px;top:80px;z-index:40;width:250px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px rgba(6,47,85,.18);padding:14px;font-size:13px}
.hud h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scoreRow{display:flex;align-items:center;gap:12px}.scoreRow svg{width:78px;height:78px;flex-shrink:0}.scoreRow b{font-size:30px;line-height:1;display:block}.scoreRow span{font-size:11px;color:var(--muted);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.kpi{background:#F7FAFE;border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}.kpi b{display:block;font-size:17px}.kpi span{font-size:10px;color:var(--muted);font-weight:800}
.mission{margin-top:10px;background:#FFF8E8;border:1px solid #FFE3A3;border-radius:16px;padding:10px;font-size:12px;line-height:1.4}.mission b{display:block;color:#5E4300;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.bdg{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:#F7FAFE;border:1px solid var(--line);filter:grayscale(1);opacity:.45}.bdg.on{filter:none;opacity:1;background:#FFF3D6;border-color:#FFD98A;box-shadow:0 6px 16px rgba(253,177,43,.3)}
.abbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;width:min(760px,calc(100vw - 320px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 50px rgba(6,47,85,.18);padding:10px 14px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:850}
.abbar .track{flex:1;height:12px;border-radius:99px;background:#E6EFF8;position:relative;overflow:hidden}.abbar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--blue),var(--gold),var(--green));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.abbar .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#fff;border:2px solid var(--gold)}
.legend{position:fixed;right:14px;bottom:70px;z-index:40;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:11px;font-weight:800;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.panel{position:fixed;top:80px;right:14px;bottom:70px;z-index:45;width:min(400px,calc(100vw - 28px));max-width:100vw;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(6,47,85,.24);padding:18px;overflow:auto;transform:translateX(120%);transition:transform .3s ease}.panel.open{transform:none}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel .head>div{min-width:0}.panel h2{margin:0;font-size:19px;line-height:1.2;letter-spacing:-.02em}.panel .eyebrow{display:inline-block;background:#EAF5FF;border:1px solid #D5EAFB;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.panel p{color:var(--muted);line-height:1.5;font-size:13px}.panel h4{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel ul{padding-left:18px;margin:0;font-size:13px;line-height:1.5}.panel li{margin-bottom:5px}.panel a{color:#07588e}
.state{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}.state.locked{background:#EEF2F6;color:#7d8da0}.state.available{background:#FFF3D6;color:#5E4300}.state.submitted{background:#FFF3D6;color:#5E4300}.state.approved{background:#E6F7DE;color:#1f6d12}.state.open{background:#E6F7DE;color:#1f6d12}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
textarea{width:100%;border:1px solid #9eb7cb;border-radius:12px;padding:10px;font:inherit;font-size:13px;min-height:70px;resize:vertical}
.close{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:#F7FAFE;font-size:18px;font-weight:900;color:var(--navy)}
.chip{display:inline-block;border-radius:999px;padding:5px 9px;background:#F7FAFE;border:1px solid var(--line);font-size:11px;font-weight:900;margin:2px 4px 2px 0}
.note{background:#FFF8E8;border:1px solid #FFE3A3;border-radius:14px;padding:10px;font-size:12px;color:#5E4300;line-height:1.45;margin-top:12px}
.toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-20px);z-index:60;background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:900;font-size:14px;box-shadow:0 16px 50px rgba(6,47,85,.35);opacity:0;pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.help{position:fixed;left:14px;bottom:18px;z-index:40;font-size:11px;color:#dfedf7;font-weight:800;opacity:.85}
@media(max-width:900px){body.panel-open .hud{display:none}.tools{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.hud{width:200px;padding:10px}.scoreRow svg{width:60px;height:60px}.scoreRow b{font-size:24px}.kpis{gap:4px}.abbar{width:calc(100vw - 28px);bottom:64px}.legend{display:none}.panel{top:auto;height:62dvh;bottom:0;right:0;left:0;width:100%;border-radius:24px 24px 0 0;transform:translateY(110%)}.panel.open{transform:none}.tools .hideS{display:none}.help{display:none}.brand small{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><img src="assets/brand/beglobal-logo.png" alt="Be Global Pro"><div>Be Global Pro<small>Mapa neural · Ruta de dropshipping 0 → 100</small></div></a>
  <div class="tools">
    <div class="seg" id="modeSeg"><button data-mode="member" class="on">Miembro</button><button data-mode="team">Team</button></div>
    <button class="btn gold" id="btnMission">🎯 Misión activa</button>
    <button class="btn hideS" id="btnFit">🧭 Ver todo</button>
    <button class="btn hideS" id="btnCollapse">⤵ Colapsar</button>
    <button class="btn danger hideS small" id="btnReset">Reiniciar progreso</button>
  </div>
</div>

<div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>

<aside class="hud">
  <h3>Progreso del miembro</h3>
  <div class="scoreRow">
    <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="33" fill="none" stroke="#E6EFF8" stroke-width="8"/><circle id="scoreRing" cx="40" cy="40" r="33" fill="none" stroke="#FDB12B" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 999" transform="rotate(-90 40 40)"/><text id="scoreTxt" x="40" y="46" text-anchor="middle" font-size="20" font-weight="900" fill="#062F55">0</text></svg>
    <div><b id="scoreBig">0<span style="font-size:14px">/100</span></b><span>maestría demostrada</span></div>
  </div>
  <div class="kpis"><div class="kpi"><b id="kXp">0</b><span>XP</span></div><div class="kpi"><b id="kLvl">1</b><span>nivel</span></div><div class="kpi"><b id="kStreak">0</b><span>racha 🔥</span></div></div>
  <div class="mission" id="missionBox"><b>Misión activa</b><span>—</span></div>
  <div class="badges" id="badges"></div>
</aside>

<div class="abbar"><div class="dot">A</div><span id="abLeft">Hoy</span><div class="track"><div class="fill" id="abFill"></div></div><span id="abRight">Master</span><div class="dot" style="border-color:#45B114">B</div></div>
<div class="legend"><span><i style="background:#FDB12B"></i>disponible</span><span><i style="background:#45B114"></i>aprobado</span><span><i style="background:#6a4a08"></i>evidencia entregada</span><span><i style="background:#3a5470"></i>bloqueado</span><span><i style="background:#FDB12B;border-radius:2px"></i>compuerta</span></div>
<div class="help">Arrastra para mover · rueda para zoom · clic en una neurona para expandir</div>

<aside class="panel" id="panel"><div id="panelBody"></div></aside>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script src="ruta-dropshipping-0-100.js"></script>
<script src="ruta-neural.js"></script>
</body>
</html>
