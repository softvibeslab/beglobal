<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Be Global · Duolingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../shared/app.css">
  <link rel="stylesheet" href="../shared/duolingo.css">
</head>
<body id="app">
  <!-- Contenido dinámico será inyectado aquí -->
  <div id="app-container"></div>

  <script src="../shared/app.js"></script>
  <script src="../shared/duolingo.js"></script>

  <script>
    /**
     * Router Central para Fase 2 Duolingo
     * Detecta si el usuario completó diagnóstico y navega a la página correcta
     */

    const Router = {
      routes: {
        diagnosis: "diagnosis.html",
        lessons: "lessons.html",
        missions: "missions.html",
        dashboard: "dashboard.html"
      },

      async detectRoute() {
        try {
          // Verificar si completó diagnóstico
          const data = await api("/api/gamification/dashboard");

          // Si llegó aquí, ya está onboarded
          const current = new URL(window.location).searchParams.get("view") || "lessons";
          return this.routes[current] || this.routes.lessons;
        } catch (err) {
          // API error o no autenticado
          if (err.status === 401 || err.message.includes("not found")) {
            // Primera vez, mostrar diagnóstico
            return this.routes.diagnosis;
          }
          // Fallback a diagnóstico
          return this.routes.diagnosis;
        }
      },

      async init() {
        try {
          const route = await this.detectRoute();
          window.location.href = `./${route}`;
        } catch (err) {
          console.error("Router error:", err);
          document.getElementById("app-container").innerHTML = `
            <div style="padding: 2rem; text-align: center;">
              <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
              <h1 style="font-size: 1.2rem; margin-bottom: 0.5rem;">No se pudo cargar</h1>
              <p style="color: var(--muted-2); margin-bottom: 1.5rem;">Intenta recargando la página</p>
              <button class="btn" onclick="window.location.reload()">Recargar</button>
            </div>
          `;
        }
      }
    };

    // Initialize on load
    document.addEventListener("DOMContentLoaded", () => {
      Router.init();
    });

    // Fallback si DOMContentLoaded ya pasó
    if (document.readyState === "interactive" || document.readyState === "complete") {
      Router.init();
    }
  </script>

  <style>
    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 500px;
    }

    .btn {
      width: 100%;
      padding: 1rem;
    }
  </style>
</body>
</html>
